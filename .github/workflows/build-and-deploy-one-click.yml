name: Build and Deploy - One Click
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug || gradle assembleDebug
      - name: Copy APK into PWA
        run: |
          mkdir -p pwa/downloads
          cp app/build/outputs/apk/debug/app-debug.apk pwa/downloads/EWishare.apk || echo "no apk yet"
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
